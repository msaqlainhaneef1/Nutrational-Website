<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background gradient rounded square -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="#ffffff" opacity="0.08"/>

  <!-- Leaf shape (left side) - represents nutrition -->
  <path d="M 18 44 Q 16 30 26 22 Q 36 14 44 18 Q 42 30 32 38 Q 24 44 18 44 Z"
        fill="url(#leaf)"/>

  <!-- Leaf vein -->
  <path d="M 22 42 Q 30 32 42 20"
        stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Checkmark / solve symbol (right side) - represents solving/calculating -->
  <path d="M 38 38 L 44 44 L 54 30"
        stroke="#ffffff" stroke-width="3.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
