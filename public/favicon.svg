<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background gradient rounded square -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="#ffffff" opacity="0.08"/>

  <!-- Symmetric geometric leaf outline with subtle glassmorphic fill -->
  <path d="M 32 6 C 14 18 14 46 32 58 C 50 46 50 18 32 6 Z" fill="rgba(255, 255, 255, 0.15)" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Center stem/vein -->
  <path d="M 32 58 L 32 44" stroke="white" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Integrated bold checkmark representing solver -->
  <path d="M 18 30 L 28 42 L 48 18" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
